[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imsel-filter-pipeline"
version = "0.1.0"
description = "WVF, LF, and c-GMM filter pipeline for edge and orientation detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest"]
viewer = [
    "streamlit>=1.35",
    "Pillow>=10.0",
]

[project.scripts]
imsel-nms = "nms.cli:main"
imsel-pipeline-full-dump = "pipeline.full_image_dump:main"
imsel-pipeline-fusion-dump = "pipeline.fusion_image_dump:main"
imsel-pipeline-synthetic-eval = "pipeline.synthetic_eval:main"
imsel-pipeline-verify = "pipeline.verify:main"
wvf = "wvf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
