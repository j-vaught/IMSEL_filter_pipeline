[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecritic"
version = "0.1.0"
description = "Wide View Filter and Line Filter for edge detection research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest"]
viewer = [
    "streamlit>=1.35",
    "Pillow>=10.0",
]

[project.scripts]
edgecritic-nms = "nms.cli:main"
edgecritic-pipeline-full-dump = "pipeline.full_image_dump:main"
edgecritic-pipeline-fusion-dump = "pipeline.fusion_image_dump:main"
edgecritic-pipeline-synthetic-eval = "pipeline.synthetic_eval:main"
edgecritic-pipeline-verify = "pipeline.verify:main"
wvf-metal = "wvf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
