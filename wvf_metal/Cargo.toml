[package]
name = "wvf_metal_backend"
version = "0.1.0"
edition = "2021"
build = "rust/build.rs"

[lib]
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
nalgebra = "0.33"
num-complex = "0.4"
rayon = "1.11"
rustfft = "6.4"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

[build-dependencies]
cc = "1.0"
