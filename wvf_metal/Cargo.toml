[package]
name = "wvf_metal_backend"
version = "0.1.0"
edition = "2021"
build = "rust/build.rs"

[lib]
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
foreign-types = "0.5"
metal = "0.29"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSObject"] }
objc2-metal = { version = "0.3.2", features = ["MTLBuffer", "MTLCommandQueue", "MTLDevice"] }
objc2-metal-performance-shaders = { version = "0.3.2", features = ["MPSCoreTypes"] }
objc2-metal-performance-shaders-graph = "0.3.2"

[build-dependencies]
cc = "1.0"
