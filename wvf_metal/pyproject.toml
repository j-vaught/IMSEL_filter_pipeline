[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wvf-metal"
version = "0.1.0"
description = "Standalone Metal implementation of radius-defined Wide View Filter gradients"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
image = ["imageio>=2.31"]

[project.scripts]
wvf-metal = "wvf_metal.cli:main"
wvf-metal-regression = "wvf_metal.fft_regression:main"

[tool.setuptools]
packages = ["wvf_metal"]
package-dir = {"wvf_metal" = "."}

[tool.setuptools.package-data]
wvf_metal = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "rust/build.rs",
    "rust/src/*.rs",
    "rust/src/fft_backend/*.rs",
    "rust/src/*.metal",
    "rust/src/*.cpp",
    "rust/src/*.cu",
    "rust/third_party/VkFFT_LICENSE.txt",
    "rust/third_party/vkFFT/**/*.h",
    "rust/third_party/metal-cpp/**/*.hpp",
    "rust/third_party/metal-cpp/LICENSE.txt",
]
